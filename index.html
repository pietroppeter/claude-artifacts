<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Artifacts · pietroppeter</title>
<meta name="description" content="Static pages made with Claude by Pietro Peterlongo.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#fbfafc;--fg:#1f1a22;--mute:#6f6675;--line:#e7e2ea;--accent:#a3287f;--sans:"Public Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#17131a;--fg:#ece6ef;--mute:#a49aab;--line:#2d2631;--accent:#e06cc0;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
main{max-width:680px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:1.4rem;margin:0 0 4px}
p.lede{color:var(--mute);margin:0 0 28px}
ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:1fr auto;gap:2px 16px}
li a{color:var(--fg);font-weight:600;text-decoration:none} li a:hover,li a:focus-visible{color:var(--accent);text-decoration:underline}
li time{font-family:var(--mono);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
li p{grid-column:1/-1;margin:0;color:var(--mute);font-size:13.5px}
footer{margin-top:28px;font-size:12px;color:var(--mute)} footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Claude Artifacts</h1>
<p class="lede">Pages made with Claude, published as static HTML.</p>
<ul>
<!-- newest first; one <li> per page folder -->
<li><a href="fosdem-devrooms/">FOSDEM Devrooms 2024–2027</a><time datetime="2026-10-22">2026-10-22</time><p>2027 accepted devrooms against 2024–2026: new, back, confirmed, dropped. Renamed rooms merged.</p></li>
</ul>
<footer>Source: <a href="https://github.com/pietroppeter/claude-artifacts">pietroppeter/claude-artifacts</a></footer>
</main>
</body>
</html>
