# generated by nimforge from packages.json + jsony.nimble
context:
  name: jsony
  version: "1.1.6"

package:
  name: nim-jsony
  version: ${{ version }}

source:
  git: https://github.com/treeform/jsony
  tag: 1.1.6

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=1.4.0

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import jsony' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/jsony
  license: MIT
  summary: "A loose direct to object json parser with hooks."
