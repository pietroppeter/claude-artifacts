# generated by nimforge from packages.json + crunchy.nimble
context:
  name: crunchy
  version: "0.1.11"

package:
  name: nim-crunchy
  version: ${{ version }}

source:
  git: https://github.com/guzba/crunchy
  tag: 0.1.11

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
    - nim-nimsimd >=1.2.4
  run_constraints:
    - nim >=1.4.8

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import crunchy' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/guzba/crunchy
  license: MIT
  summary: "SIMD-optimized hashing, checksums and CRCs"
