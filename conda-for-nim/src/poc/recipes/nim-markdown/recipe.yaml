# generated by nimforge from packages.json + markdown.nimble
context:
  name: markdown
  version: "0.8.8"

package:
  name: nim-markdown
  version: ${{ version }}

source:
  git: https://github.com/soasme/nim-markdown
  tag: v0.8.8

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=0.19.0

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import markdown' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/soasme/nim-markdown
  license: MIT
  summary: "A Markdown Parser in Nim World."
