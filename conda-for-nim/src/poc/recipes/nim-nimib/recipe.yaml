# generated by nimforge from packages.json + nimib.nimble
context:
  name: nimib
  version: "0.4.3"

package:
  name: nim-nimib
  version: ${{ version }}

source:
  git: https://github.com/pietroppeter/nimib
  tag: v0.4.3

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
    - nim-fusion >=1.2
    - nim-markdown >=0.8.1
    - nim-parsetoml >=0.7.0
    - nim-jsony >=1.1.5
  run_constraints:
    - nim >=1.4.0

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import nimib' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/pietroppeter/nimib
  license: MIT
  summary: "nimib 🐳 - nim 👑 driven ⛵ publishing ✍"
