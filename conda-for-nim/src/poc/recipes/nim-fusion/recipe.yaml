# generated by nimforge from packages.json + fusion.nimble
context:
  name: fusion
  version: "1.2"

package:
  name: nim-fusion
  version: ${{ version }}

source:
  git: https://github.com/nim-lang/fusion
  tag: v1.2

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=1.0.0


about:
  homepage: https://github.com/nim-lang/fusion
  license: MIT
  summary: "Extensions for Nim's stdlib"
