# generated by nimforge from packages.json + nimsimd.nimble
context:
  name: nimsimd
  version: "1.3.2"

package:
  name: nim-nimsimd
  version: ${{ version }}

source:
  git: https://github.com/guzba/nimsimd
  tag: 1.3.2

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=1.0.0

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import nimsimd/sse2' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/guzba/nimsimd
  license: MIT
  summary: "Pleasant Nim bindings for SIMD instruction sets."
