# The one missing piece: tell nim (and nimble) where conda puts Nim packages.
# nim's `nimblepath` switch already honours $NIMBLE_DIR/pkgs2.
package:
  name: nim-activation
  version: "0.1.0"

build:
  number: 0
  noarch: generic
  script:
    - mkdir -p $PREFIX/etc/conda/activate.d $PREFIX/etc/conda/deactivate.d $PREFIX/share/nimble/pkgs2
    - cp $RECIPE_DIR/activate.sh $PREFIX/etc/conda/activate.d/nim-activation.sh
    - cp $RECIPE_DIR/deactivate.sh $PREFIX/etc/conda/deactivate.d/nim-activation.sh
    - touch $PREFIX/share/nimble/pkgs2/.keep

about:
  license: MIT
  summary: Point NIMBLE_DIR at the conda environment, so nim finds conda-installed Nim packages
