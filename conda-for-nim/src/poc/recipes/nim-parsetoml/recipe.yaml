# generated by nimforge from packages.json + parsetoml.nimble
context:
  name: parsetoml
  version: "0.7.2"

package:
  name: nim-parsetoml
  version: ${{ version }}

source:
  git: https://github.com/NimParsers/parsetoml.git
  tag: v0.7.2

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=0.18.0

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import parsetoml' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/NimParsers/parsetoml.git
  license: MIT
  summary: "Toml parser library for Nim"
