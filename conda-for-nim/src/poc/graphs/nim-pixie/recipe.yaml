# generated by nimforge from packages.json + pixie.nimble
context:
  name: pixie
  version: "6.1.0"

package:
  name: nim-pixie
  version: ${{ version }}

source:
  git: https://github.com/treeform/pixie
  tag: 6.1.0

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
    - nim-vmath >=3.0.0
    - nim-chroma >=1.0.0
    - nim-zippy >=0.10.16
    - nim-flatty >=0.3.4
    - nim-nimsimd >=1.3.2
    - nim-bumpy >=1.1.3
    - nim-crunchy >=0.1.11
  run_constraints:
    - nim >=2.0.0

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import pixie' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/pixie
  license: MIT
  summary: "Full-featured 2d graphics library for Nim."
