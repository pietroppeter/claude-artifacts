# generated by nimforge from packages.json + boxy.nimble
context:
  name: boxy
  version: "0.7.0"

package:
  name: nim-boxy
  version: ${{ version }}

source:
  git: https://github.com/treeform/boxy
  tag: 0.7.0

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
    - nim-shady >=0.1.4
    - nim-bitty >=0.1.4
    - nim-windy >=0.4.4
  run_constraints:
    - nim >=1.2.2

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import boxy' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/boxy
  license: MIT
  summary: "2D GPU rendering with a tiling atlas."
