# generated by nimforge from packages.json + x11.nimble
context:
  name: x11
  version: "1.2"

package:
  name: nim-x11
  version: ${{ version }}

source:
  git: https://github.com/nim-lang/x11
  tag: 1.2

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r . $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >0.9.2


about:
  homepage: https://github.com/nim-lang/x11
  license: MIT
  summary: "Wrapper for X11"
