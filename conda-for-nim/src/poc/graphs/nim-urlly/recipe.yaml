# generated by nimforge from packages.json + urlly.nimble
context:
  name: urlly
  version: "1.1.1"

package:
  name: nim-urlly
  version: ${{ version }}

source:
  git: https://github.com/treeform/urlly
  tag: 1.1.1

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=1.2.2

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import urlly' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/urlly
  license: MIT
  summary: "URI and URL parsing for Nim for C/JS backends. Similar API to browsers's `window.location`."
