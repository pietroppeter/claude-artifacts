# generated by nimforge from packages.json + zippy.nimble
context:
  name: zippy
  version: "0.10.20"

package:
  name: nim-zippy
  version: ${{ version }}

source:
  git: https://github.com/guzba/zippy
  tag: 0.10.20

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=1.0.10

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import zippy' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/guzba/zippy
  license: MIT
  summary: "Pure Nim implementation of deflate, zlib, gzip and zip."
