# generated by nimforge from packages.json + webby.nimble
context:
  name: webby
  version: "0.2.1"

package:
  name: nim-webby
  version: ${{ version }}

source:
  git: https://github.com/treeform/webby/
  tag: 0.2.1

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=1.2.2

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import webby' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/webby/
  license: MIT
  summary: "Common HTTP data structures and functionality"
