# generated by nimforge from packages.json + bitty.nimble
context:
  name: bitty
  version: "0.1.4"

package:
  name: nim-bitty
  version: ${{ version }}

source:
  git: https://github.com/treeform/bitty/
  tag: 0.1.4

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=1.2.2

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import bitty' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/bitty/
  license: MIT
  summary: "Utilities with dealing with 1d and 2d bit arrays."
