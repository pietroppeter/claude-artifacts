# generated by nimforge from packages.json + flatty.nimble
context:
  name: flatty
  version: "0.4.0"

package:
  name: nim-flatty
  version: ${{ version }}

source:
  git: https://github.com/treeform/flatty
  tag: 0.4.0

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=1.4.0

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import flatty' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/flatty
  license: MIT
  summary: "Flatty - tools and serializer for plain flat binary files."
