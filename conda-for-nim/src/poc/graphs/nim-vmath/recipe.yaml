# generated by nimforge from packages.json + vmath.nimble
context:
  name: vmath
  version: "3.0.0"

package:
  name: nim-vmath
  version: ${{ version }}

source:
  git: https://github.com/treeform/vmath
  tag: 3.0.0

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=1.4.0

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import vmath' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/vmath
  license: MIT
  summary: "Your single stop for vector math routines for 2d and 3d graphics."
