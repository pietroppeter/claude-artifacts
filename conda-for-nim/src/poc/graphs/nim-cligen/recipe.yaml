# generated by nimforge from packages.json + cligen.nimble
context:
  name: cligen
  version: "1.11.0"

package:
  name: nim-cligen
  version: ${{ version }}

source:
  git: https://github.com/c-blake/cligen.git
  tag: 1.11.0

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r . $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=1.4.0

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import cligen' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/c-blake/cligen.git
  license: MIT/ISC
  summary: "Infer & generate command-line interface/option/argument parser"
