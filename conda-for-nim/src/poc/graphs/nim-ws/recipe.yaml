# generated by nimforge from packages.json + ws.nimble
context:
  name: ws
  version: "0.6.0"

package:
  name: nim-ws
  version: ${{ version }}

source:
  git: https://github.com/treeform/ws
  tag: 0.6.0

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=1.0.0

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import ws' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/ws
  license: MIT
  summary: "Simple WebSocket library for nim."
