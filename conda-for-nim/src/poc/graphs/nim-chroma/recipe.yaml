# generated by nimforge from packages.json + chroma.nimble
context:
  name: chroma
  version: "1.0.0"

package:
  name: nim-chroma
  version: ${{ version }}

source:
  git: https://github.com/treeform/chroma
  tag: v1.0.0

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=1.2.0

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import chroma' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/chroma
  license: MIT
  summary: "Everything you want to do with colors"
