# generated by nimforge from packages.json + windy.nimble
context:
  name: windy
  version: "0.5.0"

package:
  name: nim-windy
  version: ${{ version }}

source:
  git: https://github.com/treeform/windy
  tag: 0.5.0

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
    - nim-opengl >=1.2.6
    - nim-pixie >=5.1.0
    - nim-urlly >=1.0.0
    - nim-ws >=0.5.0
  run_constraints:
    - nim >=1.4.8

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import windy' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/windy
  license: MIT
  summary: "Windy"
