# generated by nimforge from packages.json + fidget2.nimble
context:
  name: fidget2
  version: "0.1.2"

package:
  name: nim-fidget2
  version: ${{ version }}

source:
  git: https://github.com/treeform/fidget2
  tag: 0.1.2

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
    - nim-cligen >=1.0.0
    - nim-jsony >=1.1.5
    - nim-puppy >=2.1.2
    - nim-boxy >=0.6.6
  run_constraints:
    - nim >=2.2.4

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import fidget2' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/fidget2
  license: MIT
  summary: "Fidget2 is a cross platform UI library leveraging Figma."
