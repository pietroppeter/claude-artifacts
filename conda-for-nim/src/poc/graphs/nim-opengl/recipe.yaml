# generated by nimforge from packages.json + opengl.nimble
context:
  name: opengl
  version: "1.2.9"

package:
  name: nim-opengl
  version: ${{ version }}

source:
  git: https://github.com/nim-lang/opengl
  tag: 1.2.9

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
    - nim-x11 >=1.1
  run_constraints:
    - nim >=0.11.0

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import opengl' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/nim-lang/opengl
  license: MIT
  summary: "an OpenGL wrapper"
