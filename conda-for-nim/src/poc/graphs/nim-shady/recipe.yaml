# generated by nimforge from packages.json + shady.nimble
context:
  name: shady
  version: "0.1.5"

package:
  name: nim-shady
  version: ${{ version }}

source:
  git: https://github.com/treeform/shady
  tag: 0.1.5

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
    - nim-vmath >=2.0.1
    - nim-pixie >=5.1.0
  run_constraints:
    - nim >=1.1.4

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import shady' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/shady
  license: MIT
  summary: "Nim to GPU shader language compiler and supporting utilities."
