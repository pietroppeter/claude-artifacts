# generated by nimforge from packages.json + puppy.nimble
context:
  name: puppy
  version: "2.1.2"

package:
  name: nim-puppy
  version: ${{ version }}

source:
  git: https://github.com/treeform/puppy
  tag: 2.1.2

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
    - nim-libcurl >=1.0.0
    - nim-zippy >=0.10.0
    - nim-webby >=0.2.0
  run_constraints:
    - nim >=1.2.2

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import puppy' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/puppy
  license: MIT
  summary: "Puppy fetches resources via HTTP and HTTPS."
