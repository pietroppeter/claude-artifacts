# generated by nimforge from packages.json + bumpy.nimble
context:
  name: bumpy
  version: "1.1.3"

package:
  name: nim-bumpy
  version: ${{ version }}

source:
  git: https://github.com/treeform/bumpy
  tag: 1.1.3

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r src/. $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
    - nim-vmath >=2.0.0
  run_constraints:
    - nim >=1.2.2

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import bumpy' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/treeform/bumpy
  license: MIT
  summary: "2d collision library."
