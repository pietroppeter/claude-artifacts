# generated by nimforge from packages.json + libcurl.nimble
context:
  name: libcurl
  version: "1.0.0"

package:
  name: nim-libcurl
  version: ${{ version }}

source:
  git: https://github.com/Araq/libcurl
  tag: v1.0.0

build:
  number: 0
  noarch: generic
  script:
    # the pkgs2 layout nim's --nimblePath already understands
    - mkdir -p $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}
    - cp -r . $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/
    - rm -rf $PREFIX/share/nimble/pkgs2/${{ name }}-${{ version }}/.git

requirements:
  run:
    - nim-activation
  run_constraints:
    - nim >=0.10.0

tests:
  - script:
      # NIMBLE_DIR comes from nim-activation; no --path, no nimble
      - echo 'import libcurl' > t.nim
      - nim check --hints:off t.nim
    requirements:
      run:
        - nim

about:
  homepage: https://github.com/Araq/libcurl
  license: MIT
  summary: "Nim wrapper for libcurl."
